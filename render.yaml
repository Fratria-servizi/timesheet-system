services:
  - type: web
    name: timesheet-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: timesheet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://timesheet-admin.vercel.app,https://timesheet-company.vercel.app,https://timesheet-employee.vercel.app

databases:
  - name: timesheet-db
    databaseName: timesheet
    user: timesheet_user
    plan: free 