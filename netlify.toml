[build]
  publish = "frontend/admin-app/build"
  command = "cd frontend/admin-app && npm install && npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview]
  command = "cd frontend/admin-app && npm install && npm run build"

[context.branch-deploy]
  command = "cd frontend/admin-app && npm install && npm run build" 