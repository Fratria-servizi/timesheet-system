name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ deployment ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy-all-apps:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    # Deploy Admin App
    - name: Install Admin dependencies
      working-directory: ./frontend/admin-app
      run: npm ci
        
    - name: Build Admin app
      working-directory: ./frontend/admin-app
      run: npm run build
      env:
        CI: false
        REACT_APP_API_URL: https://timesheet-system.onrender.com
        
    - name: Deploy Admin to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/admin-app/build
        destination_dir: admin
        force_orphan: true
        
    # Deploy Company App
    - name: Install Company dependencies
      working-directory: ./frontend/company-app
      run: npm ci
      
    - name: Build Company app
      working-directory: ./frontend/company-app
      run: npm run build
      env:
        CI: false
        REACT_APP_API_URL: https://timesheet-system.onrender.com
        
    - name: Deploy Company to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/company-app/build
        destination_dir: company
        force_orphan: false
        
    # Deploy Employee App
    - name: Install Employee dependencies
      working-directory: ./frontend/employee-app
      run: npm ci
      
    - name: Build Employee app
      working-directory: ./frontend/employee-app
      run: npm run build
      env:
        CI: false
        REACT_APP_API_URL: https://timesheet-system.onrender.com
        
    - name: Deploy Employee to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/employee-app/build
        destination_dir: employee
        force_orphan: false 