name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ deployment ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy-admin:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Debug - List files
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing files:"
        ls -la
        echo "Listing frontend directory:"
        ls -la frontend/
        echo "Listing admin-app directory:"
        ls -la frontend/admin-app/
        
    - name: Install dependencies
      working-directory: ./frontend/admin-app
      run: |
        echo "Installing dependencies in $(pwd)"
        npm ci --verbose
        
    - name: Build app
      working-directory: ./frontend/admin-app
      run: |
        echo "Building app in $(pwd)"
        npm run build
        echo "Build completed. Listing build directory:"
        ls -la build/
      env:
        REACT_APP_API_URL: https://timesheet-system.onrender.com
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/admin-app/build
        destination_dir: admin

  deploy-company:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      working-directory: ./frontend/company-app
      run: npm ci
      
    - name: Build app
      working-directory: ./frontend/company-app
      run: npm run build
      env:
        REACT_APP_API_URL: https://timesheet-system.onrender.com
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/company-app/build
        destination_dir: company

  deploy-employee:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      working-directory: ./frontend/employee-app
      run: npm ci
      
    - name: Build app
      working-directory: ./frontend/employee-app
      run: npm run build
      env:
        REACT_APP_API_URL: https://timesheet-system.onrender.com
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./frontend/employee-app/build
        destination_dir: employee 